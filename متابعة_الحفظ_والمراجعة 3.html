<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِرقاة الحفظ — متابعة الدروس والحفظ والمراجعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F2E9;
    --panel: #FFFDF8;
    --ink: #2E2B24;
    --ink-soft: #6b6355;
    --teal: #1E4B34;
    --teal-light: #DEEAE1;
    --gold: #C79A46;
    --gold-light: #F6E9C9;
    --line: #DCD2BC;
    --good: #3E7350;
    --shadow: 0 6px 20px rgba(46,43,36,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 90% -10%, #EFE6CF 0%, transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, #E5EEE7 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}

  .dua{
    text-align:center;
    font-family:'Aref Ruqaa', serif;
    font-size:20px;
    color:var(--teal);
    background:var(--gold-light);
    border:1px solid var(--gold);
    border-radius:999px;
    padding:8px 20px;
    width:fit-content;
    margin:0 auto 18px;
    box-shadow:var(--shadow);
  }

  header{
    text-align:center;
    margin-bottom:26px;
    position:relative;
  }
  .eyebrow{
    letter-spacing:2px;
    font-size:12.5px;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:44px;
    margin:6px 0 4px;
    color:var(--teal);
  }
  .sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:10px;}
  .divider{
    width:220px;height:10px;margin:16px auto 0;
    background-image: radial-gradient(circle, var(--gold) 1.6px, transparent 1.8px);
    background-size: 14px 14px;
    opacity:.6;
  }

  /* month controls */
  .month-bar{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin:22px 0 18px;
  }
  .month-bar button{
    border:1px solid var(--line);background:var(--panel);
    color:var(--teal); width:38px;height:38px;border-radius:50%;
    font-size:16px; cursor:pointer; box-shadow:var(--shadow);
    transition:.15s;
  }
  .month-bar button:hover{background:var(--teal);color:#fff;}
  .month-label{
    font-family:'Aref Ruqaa', serif;
    font-size:24px; color:var(--ink); min-width:200px; text-align:center;
  }

  /* stats */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
    margin-bottom:24px;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 14px;
    box-shadow:var(--shadow);
  }
  .stat-title{
    font-size:13px;color:var(--ink-soft);margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .stat-num{font-family:'Aref Ruqaa',serif;font-size:20px;color:var(--teal);}
  .bar-track{
    height:10px;border-radius:6px;background:var(--line);overflow:hidden;
  }
  .bar-fill{
    height:100%; border-radius:6px;
    background:linear-gradient(90deg, var(--gold), var(--teal));
    width:0%; transition:width .5s ease;
  }
  .bar-fill.lesson{background:linear-gradient(90deg,#8FAF9C,var(--teal));}
  .bar-fill.hifz{background:linear-gradient(90deg,var(--gold),#a97f2f);}
  .bar-fill.murajaa{background:linear-gradient(90deg,#8CB6A6,var(--good));}

  /* table */
  .table-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    background:var(--teal-light);
    color:var(--teal);
    font-weight:700;
    font-size:13.5px;
    padding:12px 8px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;
  }
  th.wide, td.wide{text-align:right;padding-right:16px;}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:nth-child(even){background:#FBF8F1;}
  tbody tr.done-row{background:var(--teal-light) !important;}
  td{padding:9px 6px;text-align:center;font-size:14px;vertical-align:middle;}
  .day-num{
    font-family:'Aref Ruqaa',serif;font-size:17px;color:var(--gold);
    width:34px;
  }
  input[type="date"]{
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 6px;
    font-family:'Tajawal';
    font-size:12.5px;
    color:var(--ink-soft);
    background:#fff;
    width:128px;
  }
  input[type="text"].note{
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 8px;
    font-family:'Tajawal';
    font-size:13px;
    color:var(--ink);
    background:#fff;
    width:100%;
    min-width:110px;
  }
  input[type="checkbox"]{
    appearance:none;-webkit-appearance:none;
    width:24px;height:24px;
    border:2px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    position:relative;
    background:#fff;
    transition:.15s;
  }
  input[type="checkbox"]:hover{border-color:var(--gold);}
  input[type="checkbox"]:checked{
    background:var(--teal);
    border-color:var(--teal);
  }
  input[type="checkbox"]:checked::after{
    content:"✓";
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-52%);
    color:#fff;font-size:15px;font-weight:700;
  }
  input[type="checkbox"].hifz-cb:checked{background:var(--gold);border-color:var(--gold);}
  input[type="checkbox"].murajaa-cb:checked{background:var(--good);border-color:var(--good);}

  footer{
    text-align:center;margin-top:26px;color:var(--ink-soft);font-size:12.5px;
  }
  footer button{
    margin-top:10px;
    border:1px solid var(--line);
    background:var(--panel);
    color:#a4553f;
    padding:8px 16px;
    border-radius:20px;
    font-family:'Tajawal';
    font-size:12.5px;
    cursor:pointer;
  }
  footer button:hover{background:#f6e3dd;}

  @media (max-width:640px){
    h1{font-size:32px;}
    .stats{grid-template-columns:1fr;}
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tbody tr{
      border:1px solid var(--line);
      border-radius:14px;
      margin:10px 8px;
      padding:10px;
      background:#fff !important;
    }
    tbody tr.done-row{background:var(--teal-light) !important;}
    td{
      display:flex;justify-content:space-between;align-items:center;
      padding:7px 4px;text-align:left;border:none;
    }
    td::before{
      content:attr(data-label);
      font-weight:700;color:var(--ink-soft);font-size:12.5px;
    }
    input[type="date"], input[type="text"].note{width:60%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="dua">﴿ رَبِّ زِدْنِي عِلْمًا ﴾</div>

  <header>
    <div class="eyebrow">وِرد يومي</div>
    <h1>مِرقاة الحفظ والمراجعة</h1>
    <div class="sub">سجل يومك: الدرس، الحفظ، والمراجعة — خطوة فخطوة</div>
    <div class="divider"></div>
  </header>

  <div class="month-bar">
    <button id="prevMonth" aria-label="الشهر السابق">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button id="nextMonth" aria-label="الشهر التالي">›</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-title"><span>الدروس</span><span class="stat-num" id="lessonPct">0%</span></div>
      <div class="bar-track"><div class="bar-fill lesson" id="lessonBar"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-title"><span>الحفظ</span><span class="stat-num" id="hifzPct">0%</span></div>
      <div class="bar-track"><div class="bar-fill hifz" id="hifzBar"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-title"><span>المراجعة</span><span class="stat-num" id="murajaaPct">0%</span></div>
      <div class="bar-track"><div class="bar-fill murajaa" id="murajaaBar"></div></div>
    </div>
  </div>

  <div class="stat-card" style="margin-bottom:24px;">
    <div class="stat-title"><span>الإنجاز الكلي لهذا الشهر</span><span class="stat-num" id="totalPct">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="totalBar"></div></div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>اليوم</th>
          <th class="wide">التاريخ</th>
          <th>الدرس</th>
          <th>الحفظ</th>
          <th>المراجعة</th>
          <th class="wide">ملاحظة</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer>
    البيانات محفوظة لك تلقائيًا في هذا المتصفح
    <br>
    <button id="resetBtn">تفريغ بيانات هذا الشهر</button>
  </footer>

</div>

<script>
const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const dayNames = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth(); // 0-indexed

const tbody = document.getElementById('tbody');
const monthLabel = document.getElementById('monthLabel');

function pad(n){ return n.toString().padStart(2,'0'); }
function isoDate(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function storageKey(y,m){ return `track:${y}-${pad(m+1)}`; }

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

async function loadMonthData(y,m){
  try{
    const raw = localStorage.getItem(storageKey(y,m));
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    return {};
  }
}

async function saveMonthData(y,m,data){
  try{
    localStorage.setItem(storageKey(y,m), JSON.stringify(data));
  }catch(e){
    console.error('تعذر الحفظ', e);
  }
}

let currentData = {};

async function render(){
  const total = daysInMonth(viewYear, viewMonth);
  monthLabel.textContent = `${monthNames[viewMonth]} ${viewYear}`;
  currentData = await loadMonthData(viewYear, viewMonth);

  tbody.innerHTML = '';
  for(let d=1; d<=total; d++){
    const key = String(d);
    const entry = currentData[key] || { date: isoDate(viewYear, viewMonth, d), lesson:false, hifz:false, murajaa:false, note:'' };
    if(!currentData[key]) currentData[key] = entry;

    const weekday = dayNames[new Date(viewYear, viewMonth, d).getDay()];

    const tr = document.createElement('tr');
    tr.dataset.day = key;

    tr.innerHTML = `
      <td class="day-num" data-label="اليوم">${d}<br><span style="font-size:10.5px;color:var(--ink-soft);font-family:'Tajawal'">${weekday}</span></td>
      <td class="wide" data-label="التاريخ"><input type="date" class="date-input" value="${entry.date}"></td>
      <td data-label="الدرس"><input type="checkbox" class="lesson-cb" ${entry.lesson?'checked':''}></td>
      <td data-label="الحفظ"><input type="checkbox" class="hifz-cb" ${entry.hifz?'checked':''}></td>
      <td data-label="المراجعة"><input type="checkbox" class="murajaa-cb" ${entry.murajaa?'checked':''}></td>
      <td class="wide" data-label="ملاحظة"><input type="text" class="note" placeholder="سورة / صفحة..." value="${entry.note.replace(/"/g,'&quot;')}"></td>
    `;
    updateRowStyle(tr, entry);
    tbody.appendChild(tr);

    const dateInput = tr.querySelector('.date-input');
    const lessonCb = tr.querySelector('.lesson-cb');
    const hifzCb = tr.querySelector('.hifz-cb');
    const murajaaCb = tr.querySelector('.murajaa-cb');
    const noteInput = tr.querySelector('.note');

    dateInput.addEventListener('change', () => { entry.date = dateInput.value; persist(); });
    lessonCb.addEventListener('change', () => { entry.lesson = lessonCb.checked; updateRowStyle(tr, entry); persist(); updateStats(); });
    hifzCb.addEventListener('change', () => { entry.hifz = hifzCb.checked; updateRowStyle(tr, entry); persist(); updateStats(); });
    murajaaCb.addEventListener('change', () => { entry.murajaa = murajaaCb.checked; updateRowStyle(tr, entry); persist(); updateStats(); });
    noteInput.addEventListener('change', () => { entry.note = noteInput.value; persist(); });
  }
  updateStats();
}

function updateRowStyle(tr, entry){
  if(entry.lesson && entry.hifz && entry.murajaa){
    tr.classList.add('done-row');
  } else {
    tr.classList.remove('done-row');
  }
}

let saveTimeout;
function persist(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => saveMonthData(viewYear, viewMonth, currentData), 250);
}

function updateStats(){
  const entries = Object.values(currentData);
  const n = entries.length || 1;
  const lessonCount = entries.filter(e=>e.lesson).length;
  const hifzCount = entries.filter(e=>e.hifz).length;
  const murajaaCount = entries.filter(e=>e.murajaa).length;

  const lessonPct = Math.round((lessonCount/n)*100);
  const hifzPct = Math.round((hifzCount/n)*100);
  const murajaaPct = Math.round((murajaaCount/n)*100);
  const totalPct = Math.round(((lessonCount+hifzCount+murajaaCount)/(n*3))*100);

  document.getElementById('lessonPct').textContent = lessonPct+'%';
  document.getElementById('hifzPct').textContent = hifzPct+'%';
  document.getElementById('murajaaPct').textContent = murajaaPct+'%';
  document.getElementById('totalPct').textContent = totalPct+'%';

  document.getElementById('lessonBar').style.width = lessonPct+'%';
  document.getElementById('hifzBar').style.width = hifzPct+'%';
  document.getElementById('murajaaBar').style.width = murajaaPct+'%';
  document.getElementById('totalBar').style.width = totalPct+'%';
}

document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth--;
  if(viewMonth<0){ viewMonth=11; viewYear--; }
  render();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth++;
  if(viewMonth>11){ viewMonth=0; viewYear++; }
  render();
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('هل تريد بالفعل تفريغ بيانات هذا الشهر؟')){
    currentData = {};
    await saveMonthData(viewYear, viewMonth, {});
    render();
  }
});

render();
</script>
</body>
</html>
